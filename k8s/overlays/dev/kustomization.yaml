apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: heart-dev
resources:
  - namespace.yaml
  - ../../base
patches:
  - target: {kind: Deployment, name: heart-api}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: {kind: HorizontalPodAutoscaler, name: heart-api}
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
