name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest)
        run: |
          mkdir -p reports/ci
          python -m pytest -v --junitxml=reports/ci/pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/ci/pytest-report.xml

  train:
    name: Train model
    needs: lint-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download and clean data
        run: |
          python -m src.download_data
          python -m src.preprocess

      - name: Train, tune and track (MLflow)
        run: python -m src.train

      - name: Smoke-test inference
        run: python -m src.predict

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: |
            models/heart_model.joblib
            models/metadata.json

      - name: Upload metrics and plots
        uses: actions/upload-artifact@v4
        with:
          name: training-reports
          path: reports/models/

      - name: Upload MLflow tracking database
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-db
          path: mlflow.db
